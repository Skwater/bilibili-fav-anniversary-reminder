<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    :root { --popup-bottom-gap: 10px; }
    html, body { width: 400px; height: 600px; overflow: hidden; }
    body { margin: 0;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color: #18191c; background: #fff; }
    #mainBox { height: 600px; overflow: hidden; flex-direction: column; }
    .head, .hint, .view-tabs { flex: none; }
    .head { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px;
      border-bottom: 1px solid #f1f2f3; }
    .name { font-weight: 700; font-size: 15px; }
    .name small { color: #9499a0; font-weight: 400; margin-left: 6px; }
    .pill { border: none; font-size: 12px; padding: 2px 8px; border-radius: 10px; background: #f1f2f3;
      color: #61666d; cursor: pointer; }
    .pill:hover { background: #f1f2f3; filter: brightness(.97); }
    .pill.ok:hover { background: #e8f6fb; }
    .pill.warn:hover { background: #fff7ec; }
    .pill.sim:hover { background: #4b2e83; }
    .pill.ok { background: #e8f6fb; color: #00a1d6; }
    .pill.warn { background: #fff7ec; color: #f08519; }
    .pill.sim { background: #4b2e83; color: #fff; }
    .sec { padding: 10px 14px; border-bottom: 1px solid #f5f6f7; }
    .sec h3 { margin: 0 0 8px; font-size: 12px; color: #9499a0; font-weight: 600; }
    .line { font-size: 13px; margin: 4px 0; }
    .muted { color: #9499a0; font-size: 12px; }
    .items { max-height: 300px; overflow-y: auto; }
    .item { display: flex; gap: 8px; padding: 6px 0; cursor: pointer; align-items: center; }
    .item:hover .t { color: #00a1d6; }
    .item .cover { width: 72px; height: 45px; position: relative; flex: none; }
    .item img { width: 72px; height: 45px; object-fit: cover; border-radius: 4px; background: #f1f2f3; display: block; }
    .watch-later { position: absolute; top: 3px; right: 3px; width: 28px; height: 28px; padding: 4px; margin: 0;
      border: 0; border-radius: 6px; background: rgba(33,33,33,.8); color: #fff; opacity: 0; z-index: 1; }
    .cover:hover .watch-later, .watch-later:focus-visible, .watch-later.pending { opacity: 1; }
    .watch-later:hover { background: rgba(33,33,33,.95); }
    .watch-later svg { display: block; width: 20px; height: 20px; fill: currentColor; }
    .watch-later.pending { cursor: wait; opacity: .65; }
    .watch-later.done { background: #00a1d6; cursor: pointer; }
    .item .m { flex: 1; min-width: 0; }
    .t { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .s { font-size: 12px; color: #61666d; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
    .s2 { font-size: 11px; color: #9499a0; margin-top: 2px; }
    .bar { display: flex; gap: 8px; padding: 10px 14px var(--popup-bottom-gap); flex: none; }
    button { border: 1px solid #e3e5e7; background: #fff; color: #18191c; font-size: 13px;
      padding: 7px 0; border-radius: 8px; cursor: pointer; }
    button:hover { background: #f6f7f8; }
    .bar button { flex: 1; }
    button.primary { background: #00a1d6; border-color: #00a1d6; color: #fff; }
    button.primary:hover { background: #00b3e5; }
    .empty { text-align: center; color: #9499a0; font-size: 13px; padding: 18px 0; }
    .hint { background: #fff7ec; color: #f08519; font-size: 12px; padding: 8px 14px;
      display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .hint span { min-width: 0; line-height: 1.45; }
    .hint button { flex: none; padding: 4px 9px; font-size: 12px; color: #f08519; border-color: #f3c78f; }
    .mini-btn { flex: none; padding: 2px 10px !important; font-size: 12px; border-radius: 10px; }
    .mini-btn.danger { color: #d54949; border-color: #ff9a9a; }
    .scoperow { display: flex; align-items: center; gap: 6px; padding: 0 14px; font-size: 12px; }
    .scoperow .muted { margin-right: 2px; }
    .scope-btn { flex: none; padding: 4px 10px; font-size: 12px; border-radius: 12px; }
    .scope-btn.active { background: #00a1d6; border-color: #00a1d6; color: #fff; }
    .view-tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; margin: 6px 14px 8px;
      padding: 3px; border-radius: 9px; background: #f6f7f8; }
    .view-tab { border: none; background: transparent; color: #61666d; padding: 6px 0; border-radius: 7px; }
    .view-tab.active { background: #fff; color: #18191c; font-weight: 600; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .view-panel { flex: 1; min-height: 0; }
    .view-panel:not([hidden]) { display: flex; flex-direction: column; }
    .view-panel[hidden] { display: none; }
    .today-results { flex: 1; min-height: 0; display: flex; flex-direction: column; }
    #items { flex: 1; min-height: 0; max-height: none; }
    #calendarPanel, #reviewPanel { box-sizing: border-box; overflow: hidden; }
    .review-timeline { flex: 1; min-height: 0; overflow-y: auto; padding: 2px 10px var(--popup-bottom-gap); }
    .review-day { position: relative; display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 6px;
      padding: 4px 0 8px; }
    .review-day:not(:last-of-type)::before { content: ""; position: absolute; left: 21px; top: 42px; bottom: -4px;
      width: 1px; background: #e3e5e7; }
    .review-date { position: sticky; top: 6px; z-index: 2; align-self: start; width: 40px; height: 40px;
      box-sizing: border-box; border: 1px solid #e3e5e7; border-radius: 50%; background: #fff;
      display: flex; flex-direction: column; align-items: center; justify-content: center; color: #61666d; }
    .review-date-day { font-size: 15px; font-weight: 700; line-height: 1; }
    .review-date-month { margin-top: 2px; font-size: 9px; line-height: 1; }
    .review-day-content { min-width: 0; }
    .review-day-head { height: 40px; display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 0 4px 0 2px; }
    .review-day-label { font-size: 13px; font-weight: 600; }
    .review-day-count { color: #9499a0; font-size: 11px; white-space: nowrap; }
    .review-day-empty { color: #9499a0; font-size: 12px; padding: 8px 2px 16px; }
    .review-range-note { color: #9499a0; font-size: 12px; text-align: center; padding: 12px 4px 6px 50px; }
    .review-loading { min-height: 120px; display: grid; place-items: center; color: #9499a0; font-size: 13px; }
    .calendar-wrap { padding: 2px 14px 8px; flex: none; }
    .calendar-nav { display: grid; grid-template-columns: 32px 32px 1fr 32px 32px; align-items: center;
      gap: 3px; margin-bottom: 4px; }
    .calendar-nav button { width: 32px; height: 32px; padding: 0; border: none; font-size: 17px; color: #61666d; }
    .calendar-nav button:disabled { color: #c9cdd2; cursor: default; background: transparent; }
    .calendar-title { text-align: center; font-size: 14px; font-weight: 600; }
    .calendar-week, .calendar-days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
    .calendar-week span { text-align: center; color: #9499a0; font-size: 11px; padding: 4px 0; }
    .calendar-day { min-width: 0; height: 36px; padding: 2px 0; border: none; border-radius: 8px; background: transparent;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; line-height: 1; }
    .calendar-day:hover { background: #f6f7f8; }
    .calendar-day.outside { color: #c9cdd2; }
    .calendar-day.today:not(.selected) { background: #fff1f5; color: #fb7299; font-weight: 600; }
    .calendar-day.selected { background: #00a1d6; color: #fff; }
    .calendar-count { color: #00a1d6; font-size: 9px; white-space: nowrap; }
    .calendar-day.selected .calendar-count { color: #fff; }
    .calendar-day.outside .calendar-count { opacity: .55; }
    .calendar-day.outside.selected .calendar-count { opacity: 1; }
    .calendar-legend { display: flex; align-items: center; justify-content: flex-end; gap: 8px; min-height: 27px;
      color: #9499a0; font-size: 11px; }
    .calendar-actions { display: flex; align-items: center; gap: 8px; flex: none; }
    .calendar-text-btn { border: none; padding: 3px 0; color: #00a1d6; font-size: 11px; white-space: nowrap; }
    .calendar-results { flex: 1; min-height: 0; display: flex; flex-direction: column;
      padding-bottom: var(--popup-bottom-gap); }
    .calendar-result-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex: none; }
    .calendar-result-head h3 { margin-bottom: 6px; }
    .calendar-result-count { color: #9499a0; font-size: 11px; white-space: nowrap; }
    .calendar-items { flex: 1; min-height: 0; max-height: none; }
    .calendar-loading { min-height: 72px; display: grid; place-items: center; color: #9499a0; font-size: 13px; }

    /* 首次使用欢迎面板 */
    .welcome-box { box-sizing: border-box; width: 400px; height: 600px; padding: 32px 28px;
      flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    .welcome-box .w-name { font-size: 20px; font-weight: 700; margin-bottom: 18px; }
    .welcome-box .w-status { max-width: 320px; font-size: 16px; font-weight: 600; margin-bottom: 10px; }
    .welcome-box .w-sub { max-width: 320px; color: #61666d; font-size: 14px; line-height: 1.65;
      margin-bottom: 24px; overflow-wrap: anywhere; }
    .welcome-box .btn-go { width: 100%; max-width: 320px; flex: none; padding: 10px 12px;
      box-sizing: border-box; font-size: 14px; }
    .setup-quick-actions { width: 100%; max-width: 320px; display: flex; gap: 8px; margin-top: 8px; }
    .setup-quick-actions button { flex: 1; padding: 8px 6px; }
    .setup-quick-actions button:disabled { opacity: .5; cursor: default; }
    .setup-select-box { box-sizing: border-box; width: 400px; height: 600px; padding: 18px 20px 16px;
      flex-direction: column; }
    .setup-select-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .setup-select-head button { flex: none; padding: 5px 8px; font-size: 12px; }
    .setup-select-head strong { font-size: 16px; }
    .setup-select-note { color: #61666d; font-size: 12px; line-height: 1.5; margin-bottom: 10px; }
    .setup-retry { padding: 7px 10px; align-self: flex-start; }
    .setup-progress-box { box-sizing: border-box; width: 400px; height: 600px; padding: 32px 28px;
      flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    .setup-progress-box strong { font-size: 18px; margin-bottom: 14px; }
    .setup-progress-box p { max-width: 320px; color: #61666d; font-size: 14px; line-height: 1.65;
      overflow-wrap: anywhere; margin: 0 0 18px; }
    .setup-progress-box .btn-go { width: 100%; max-width: 320px; padding: 10px 12px; margin-bottom: 8px; }
    .setup-folders { width: 100%; min-height: 0; flex: 1; overflow-y: auto; text-align: left;
      border: 1px solid #e3e5e7; border-radius: 8px; box-sizing: border-box; }
    .setup-group-head { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 6px;
      padding: 8px 10px; background: #f6f7f8; font-size: 12px; font-weight: 600; }
    .setup-group-head span { flex: 1; }
    .setup-group-head button { padding: 3px 6px; font-size: 11px; }
    .setup-folder { display: flex; align-items: center; gap: 8px; padding: 7px 10px; font-size: 12px; }
    .setup-folder + .setup-folder { border-top: 1px solid #f5f6f7; }
    .setup-folder input { flex: none; margin: 0; }
    .setup-folder-name { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .setup-folder-count { flex: none; color: #9499a0; font-size: 11px; }
    .setup-foot { width: 100%; flex: none; margin-top: 10px; }
    .setup-foot-row { display: flex; align-items: center; gap: 6px; margin-bottom: 8px; font-size: 12px; }
    .setup-foot-row span { flex: 1; color: #61666d; }
    .setup-foot-row button { padding: 4px 8px; font-size: 11px; }
    .setup-foot .btn-go { width: 100%; box-sizing: border-box; padding: 10px 12px; font-size: 14px; }
    .setup-stop { margin-top: 10px; padding: 5px 12px; color: #d54949; }
  </style>
</head>
<body>
  <!-- 首次同步完成前的引导与同步状态 -->
  <div id="welcomeBox" class="welcome-box" style="display:none">
    <div class="w-name">哔哩朝花夕拾</div>
    <div id="welcomeStatus" class="w-status" style="display:none"></div>
    <div id="welcomeText" class="w-sub">欢迎使用！同步收藏夹后，每次打开哔哩哔哩首页，就能看到「投稿发布于 X 年前的今天」提醒。</div>
    <button id="btnGoStart" class="primary btn-go" type="button">进入哔哩哔哩</button>
    <div id="setupQuickActions" class="setup-quick-actions" style="display:none">
      <button id="btnCheckLogin" type="button">读取登录状态</button>
      <button id="btnEnterSetup" type="button">首次同步</button>
    </div>
  </div>

  <div id="setupSelectBox" class="setup-select-box" style="display:none">
    <div class="setup-select-head"><button id="btnSetupBack" type="button">返回</button><strong>选择要同步的收藏夹</strong></div>
    <div id="setupSelectNote" class="setup-select-note">正在读取收藏夹列表…</div>
    <button id="btnRetryFolders" class="setup-retry" type="button" style="display:none">重新读取收藏夹</button>
    <div id="setupFolders" class="setup-folders" style="display:none"></div>
    <div id="setupFoot" class="setup-foot" style="display:none">
      <div class="setup-foot-row"><span id="setupCount">已选 0 个</span><button id="setupAll" type="button">全选</button><button id="setupNone" type="button">全不选</button></div>
      <button id="setupStart" class="primary btn-go" type="button">开始同步所选</button>
    </div>
  </div>

  <div id="setupProgressBox" class="setup-progress-box" style="display:none">
    <strong id="setupProgressTitle">首次同步进行中</strong>
    <p id="setupProgressText">请不要关闭哔哩哔哩页面。</p>
    <button id="btnResumeFirst" class="primary btn-go" type="button" style="display:none">继续首次同步</button>
    <button id="setupStop" class="setup-stop" type="button">终止同步</button>
  </div>

  <!-- 已使用：完整面板 -->
  <div id="mainBox" style="display:none">
    <div class="head">
      <div class="name">哔哩朝花夕拾<small>收藏·历史上的今天</small></div>
      <button id="loginPill" class="pill" type="button" aria-label="打开哔哩哔哩主页">…</button>
    </div>

    <div id="debugHint" class="hint" style="display:none"></div>

    <div class="view-tabs" role="tablist" aria-label="内容视图">
      <button id="tabToday" class="view-tab active" type="button" role="tab" aria-selected="true" aria-controls="todayPanel">今日</button>
      <button id="tabReview" class="view-tab" type="button" role="tab" aria-selected="false" aria-controls="reviewPanel">七日回顾</button>
      <button id="tabCalendar" class="view-tab" type="button" role="tab" aria-selected="false" aria-controls="calendarPanel">历史日历</button>
    </div>

    <div id="todayPanel" class="view-panel" role="tabpanel" aria-labelledby="tabToday">
      <div class="sec today-results">
        <h3>今日命中（<span id="effDate">-</span>）</h3>
        <div id="items" class="items">
          <div class="empty">加载中…</div>
        </div>
      </div>

      <div class="sec" style="border-bottom:none">
        <div class="line"><span class="muted">收藏夹：</span><span id="folderInfo">-</span>
          &nbsp;<span id="syncLabel" class="muted">最近同步：</span><span id="syncInfo">-</span></div>
        <div id="syncActions" class="line" style="display:none">
          <button id="btnCancelSync" class="mini-btn danger" style="display:none">终止同步</button>
        </div>
        <div id="syncNote" class="line muted" style="display:none"></div>
      </div>

      <div class="scoperow">
        <span class="muted">本次同步范围：</span>
        <button class="scope-btn active" data-scope="all">全部</button>
        <button class="scope-btn" data-scope="created">仅我创建的</button>
        <button class="scope-btn" data-scope="collected">仅追更的</button>
      </div>

      <div class="bar">
        <button id="btnSync">增量同步</button>
        <button id="btnFull">全量重同步</button>
        <button id="btnOptions" class="primary">设置</button>
      </div>
    </div>

    <div id="reviewPanel" class="view-panel" role="tabpanel" aria-labelledby="tabReview" hidden>
      <div id="reviewTimeline" class="review-timeline">
        <div class="review-loading">正在读取…</div>
      </div>
    </div>

    <div id="calendarPanel" class="view-panel" role="tabpanel" aria-labelledby="tabCalendar" hidden>
      <div class="calendar-wrap">
        <div class="calendar-nav">
          <button id="calendarPrevYear" type="button" aria-label="上一年">«</button>
          <button id="calendarPrevMonth" type="button" aria-label="上个月">‹</button>
          <div id="calendarTitle" class="calendar-title">-</div>
          <button id="calendarNextMonth" type="button" aria-label="下个月">›</button>
          <button id="calendarNextYear" type="button" aria-label="下一年">»</button>
        </div>
        <div class="calendar-week" aria-hidden="true">
          <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
        </div>
        <div id="calendarDays" class="calendar-days" role="grid" aria-label="历史投稿日历"></div>
        <div class="calendar-legend">
          <div class="calendar-actions">
            <button id="calendarCollapse" class="calendar-text-btn" type="button" aria-expanded="true" aria-controls="calendarDays">收起日历 ↑</button>
            <button id="calendarToday" class="calendar-text-btn" type="button">回到今天</button>
          </div>
        </div>
      </div>
      <div class="sec calendar-results" style="border-bottom:none">
        <div class="calendar-result-head">
          <h3 id="calendarSelectedTitle">历史上的今天</h3>
          <span id="calendarSelectedCount" class="calendar-result-count"></span>
        </div>
        <div id="calendarItems" class="items calendar-items">
          <div class="calendar-loading">请选择日期</div>
        </div>
      </div>
    </div>
  </div>

  <script src="common.js"></script>
  <script src="popup.js"></script>
</body>
</html>
